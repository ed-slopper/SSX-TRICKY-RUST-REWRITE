[package]
name = "tricky-game"
version = "0.1.0"
edition = "2021"
description = "SSX Tricky's riding physics, wipe-outs, collision and trick data, without Bevy (row F11a)"
publish = false

[dependencies]
# the file formats and what is read from them (row F11b)
tricky-data = { path = "../data" }
# the same glam as Bevy 0.16, so tricky-rs and this crate share one Vec3
glam = "0.29.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# the function runner, to check our functions against the original (row F4d; its tests skip without TRICKY_ELF)
r5900 = { path = "../../tools/r5900" }
