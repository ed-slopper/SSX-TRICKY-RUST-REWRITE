[package]
name = "tricky-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16.1", default-features = false, features = [
    "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render",
    "bevy_winit", "bevy_window", "bevy_gizmos", "bevy_text", "bevy_ui", "default_font",
    "multi_threaded", "std", "x11", "bevy_gilrs", "bevy_audio", "vorbis", "wav",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
opt-level = 3
codegen-units = 16
