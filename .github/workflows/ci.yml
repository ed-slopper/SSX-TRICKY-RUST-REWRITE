# Board row F5. Seconds; runs on every push. Nothing here has the game.
name: Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push stops the older run of this workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: No game files, tools, names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No game files or decompiler output committed (AGENTS.md §13)
        run: python tools/check_no_game_files.py
      - name: Our Python tools compile
        run: python -m compileall -q tools
      - name: Names in ghidra/symbols.txt follow AGENTS.md §14
        run: python tools/function_index.py names
