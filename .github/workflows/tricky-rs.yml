# Board row F5. Slow (Bevy, about 20 minutes cold): runs only when tricky-rs's code (src/, Cargo.toml, Cargo.lock) changes, or by hand (Actions > tricky-rs > Run workflow).
name: tricky-rs

on:
  push:
    paths:
      - 'tricky-rs/src/**'
      - 'tricky-rs/Cargo.toml'
      - 'tricky-rs/Cargo.lock'
      - 'tricky-rs/game/**'
      - '.github/workflows/tricky-rs.yml'
  pull_request:
    paths:
      - 'tricky-rs/src/**'
      - 'tricky-rs/Cargo.toml'
      - 'tricky-rs/Cargo.lock'
      - 'tricky-rs/game/**'
      - '.github/workflows/tricky-rs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Plain text, so the annotation patterns below match (cargo colours its output on CI otherwise).
env:
  CARGO_TERM_COLOR: never

# A newer push stops the older run of this workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tricky-rs:
    # Linux only: the function runner covers Windows, and one OS halves the wait.
    name: tricky-rs (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tricky-rs
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries Bevy needs (audio, gamepads, X11)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tricky-rs
            tricky-rs/game
          cache-on-failure: true
      # cargo test builds the game too, so no separate cargo build
      - run: cargo test --locked
      - name: cargo test (tricky-game, the Bevy-free physics)
        working-directory: tricky-rs/game
        run: cargo test --locked
      # Warnings are reported, not yet fatal: the code predates CI. Row F5a makes this -D warnings.
      # Each finding also becomes an annotation (file, line, message), which can be read without signing in
      # to GitHub; GitHub shows up to 10 errors and 10 warnings per step.
      - name: cargo clippy
        shell: bash
        run: |
          set +e
          cargo clippy --locked --all-targets --message-format=short 2>&1 | tee clippy.txt
          status=${PIPESTATUS[0]}
          for level in error warning; do
            grep -E "^[^ ]+\.rs:[0-9]+:[0-9]+: $level" clippy.txt | sort -u | head -10 |
              sed -E "s#^([^:]+):([0-9]+):([0-9]+): $level(\[[^]]*\])?: (.*)#::$level file=tricky-rs/\1,line=\2,col=\3::\5 \4#"
          done
          # errors without a file location (cargo's own, build failures), and what came just before cargo gave up
          grep -E '^error' clippy.txt | sort -u | head -10 | sed -E 's#^error(\[[^]]*\])?: (.*)#::error::\2 \1#'
          grep -B25 -m1 'could not compile' clippy.txt | grep -v ': warning' | tail -10 | sed 's#^#::notice::#'
          echo "$(grep -cE ': error' clippy.txt) errors, $(grep -cE ': warning' clippy.txt) warnings"
          exit $status
